name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'ongsi2/munchekit'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.0
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Verify tag matches package version
        run: node -e "const pkg=require('./package.json'); if (process.env.GITHUB_REF_NAME !== 'v' + pkg.version) { throw new Error('tag and package version differ') }"
      - run: npm ci
      - run: npm run verify
      - run: npm run test:package
      - name: Publish with npm provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo 'NPM_TOKEN is not configured; verification passed but npm publish was skipped.'
          else
            npm publish --access public --provenance
          fi
