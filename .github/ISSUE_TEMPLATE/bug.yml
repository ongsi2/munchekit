name: 버그 제보
description: 파서, CLI, API, 보고서, 자동수정 문제를 재현합니다.
title: "[bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Node.js version
      placeholder: Windows 11, Node.js 22.0.0
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Remove private text and secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
