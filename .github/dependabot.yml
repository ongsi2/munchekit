version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Runtime and parser majors can change the supported Node.js range or AST
    # contract. Review those upgrades explicitly instead of opening noisy PRs.
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      development-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
