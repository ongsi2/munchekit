name: 오탐 제보
description: 자연스러운 문장이 규칙에 걸린 사례를 알려 주세요.
title: "[false positive] "
labels: [false-positive]
body:
  - type: markdown
    attributes:
      value: 비공개 문서, 개인정보, API 키는 넣지 마세요. 재현 가능한 최소 문장으로 줄여 주세요.
  - type: input
    id: version
    attributes:
      label: MuncheKit version
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: KO-CALQUE-002
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Profile
      options: [natural, web, tech-blog, business, thmm-tech, custom]
    validations:
      required: true
  - type: textarea
    id: sentence
    attributes:
      label: 최소 재현 문장
      render: text
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 이 표현을 유지해야 하는 이유
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: 실행 명령과 실제 출력
      render: shell
    validations:
      required: true
